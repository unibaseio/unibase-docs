# Builds the Starlight site and publishes it to GitHub Pages:
# https://docs.unibase.com/
name: Deploy docs

on:
  push:
    branches: [main]
  pull_request: # check + build only; deploy runs on main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }} # PR checks never cancel a main deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-docs.mjs # Starlight format rules — see CLAUDE.md
      - uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
